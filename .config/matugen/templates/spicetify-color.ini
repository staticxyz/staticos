; Палитра Spotify (spicetify, тема Jarvis) — из обоев, шаблон matugen (23.09.2026).
; Роли spicetify → роли Material: фон = surface_container_lowest (темнее
; surface: под прозрачностью 0.93 в niri текст остаётся контрастным), боковые панели и плеер —
; surface_container, карточки — surface_container_high, акцент кнопок и
; выбранной строки — primary. Шестнадцатеричные без «#», как требует color.ini.
[Jarvis]
text               = {{colors.on_surface.default.hex_stripped}}
; 25.09.2026: было on_surface_variant — под прозрачностью 0.86 серый текст
; (имена исполнителей, длительности) читался с трудом.
subtext            = {{colors.on_surface.default.hex_stripped}}
main               = {{colors.surface_container_lowest.default.hex_stripped}}
sidebar            = {{colors.surface_container.default.hex_stripped}}
player             = {{colors.surface_container.default.hex_stripped}}
card               = {{colors.surface_container_high.default.hex_stripped}}
shadow             = {{colors.surface_container_lowest.default.hex_stripped}}
selected-row       = {{colors.primary.default.hex_stripped}}
button             = {{colors.primary.default.hex_stripped}}
button-active      = {{colors.primary.default.hex_stripped}}
button-disabled    = {{colors.outline_variant.default.hex_stripped}}
tab-active         = {{colors.surface_container_highest.default.hex_stripped}}
notification       = {{colors.primary_container.default.hex_stripped}}
notification-error = {{colors.error.default.hex_stripped}}
misc               = {{colors.outline.default.hex_stripped}}
