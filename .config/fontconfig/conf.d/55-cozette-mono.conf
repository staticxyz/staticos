<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 08.10.2026: kitty берёт только моноширинные шрифты (spacing=mono), а у
     CozetteVector / CozetteVectorBold fontconfig отметки нет (в файле есть
     широкие значки) — kitty молча подставлял PxPlus. Помечаем их моноширинными
     при сканировании; после правки — fc-cache -f. Откат: удалить файл + fc-cache -f. -->
<fontconfig>
  <match target="scan">
    <test name="family" compare="contains"><string>CozetteVector</string></test>
    <edit name="spacing" mode="assign"><const>mono</const></edit>
  </match>
</fontconfig>
