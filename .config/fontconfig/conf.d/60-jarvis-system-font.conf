<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Шрифт системы — PxPlus HP 100LX 6x8 Jarvis. Пишет ~/.config/hypr/scripts/app_fonts.py
     (Настройки → Шрифты), руками не править: «Как было» удаляет файл. -->
<fontconfig>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>Sans Serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>Serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>Monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>Noto Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>Noto Serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>Noto Sans Mono</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>Open Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>Cantarell</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>DejaVu Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>DejaVu Sans Mono</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>JetBrainsMono Nerd Font</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>JetBrains Mono</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>JetBrainsMono Nerd Font Mono</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>JetBrainsMono Nerd Font Propo</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>JetBrainsMono NF</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
</fontconfig>
