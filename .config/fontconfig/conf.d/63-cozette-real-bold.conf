<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- У CozetteVector нет жирного: на font-weight bold fontconfig утолщал буквы сам
     (embolden) — пиксельный шрифт расплывался («waybar всё ещё ужасно выглядит»,
     08.10.2026). Жирный берётся из настоящего CozetteVectorBold, запрос веса сбрасывается на medium. -->
<fontconfig>
  <match target="pattern">
    <test name="family" compare="eq" qual="first"><string>CozetteVector</string></test>
    <test name="weight" compare="more_eq"><const>demibold</const></test>
    <edit name="family" mode="prepend" binding="strong"><string>CozetteVectorBold</string></edit>
    <!-- у файла Bold вес записан Medium: оставь запрос bold — 90-synthetic.conf всё равно
         утолщит (пользовательские правила идут раньше него, перебить нельзя) -->
    <edit name="weight" mode="assign" binding="strong"><const>medium</const></edit>
  </match>
  <!-- уже жирное семейство (системный CozetteVectorBold, kitty) с запросом bold — не утолщать -->
  <match target="pattern">
    <test name="family" compare="eq" qual="first"><string>CozetteVectorBold</string></test>
    <test name="weight" compare="more_eq"><const>demibold</const></test>
    <edit name="weight" mode="assign" binding="strong"><const>medium</const></edit>
  </match>
</fontconfig>
