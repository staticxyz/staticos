<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- «PxPlus Keep» — PxPlus HP 100LX 6x8 Jarvis, который проба Cozette (61-cozette-trial.conf)
     не подменяет: правило идёт после неё. Им написан «Пуск» в нижней панели — пользователь
     08.10.2026: «пуск надо крупным вернуть, как он был». -->
<fontconfig>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>PxPlus Keep</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PxPlus HP 100LX 6x8 Jarvis</string></edit>
  </match>
</fontconfig>
