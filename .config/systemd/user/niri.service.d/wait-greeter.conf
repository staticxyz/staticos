# 24.09.2026. Чёрный экран после быстрого ввода пароля в SDDM: niri стартовал,
# пока X-сервер экрана входа ещё не отпустил видеокарту, получал EBUSY, открывал карту
# напрямую без прав рисовать и так и оставался слепым (Permission denied на все DRM-вызовы).
# Ждём, пока X экрана входа завершится (обычно доли секунды, потолок 10 с), и только тогда
# запускаем niri. При неспешном входе X успевал сам — отсюда «подождите 10 секунд».
[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 40); do pgrep -x X >/dev/null 2>&1 || pgrep -x Xorg >/dev/null 2>&1 || pgrep -f "^/usr/bin/X " >/dev/null 2>&1 || exit 0; sleep 0.25; done; exit 0'
