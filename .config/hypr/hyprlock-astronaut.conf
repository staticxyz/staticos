# ШАБЛОН экрана блокировки в духе sddm-astronaut — hyprlock его напрямую не
# читает. `scripts/lock_style.py prepare <стиль>` подставляет метки @@…@@ и
# пишет готовый конфиг в ~/.cache/lock-style/hyprlock.conf, который запускает
# scripts/lockscreen. Используется для всех стилей, включая «Как сейчас».
#
# 15.09.2026, по скриншотам пользователя (Hyprland, Пиксельная сакура):
#   вид как у темы — шрифт варианта, форма слева или по центру,
#   поля пользователя и пароля с иконками темы (перекрашены в акцент);
#   наши детали — приветствие в поле пароля, раскладка под формой, заряд и сеть
#   в углах, Caps Lock и неверный пароль видны;
#   цвета — палитра обоев (matugen): @@…@@ с цветами подставляются из colors.json.
# Светлый фон (сакура, японский) приглушается и получает панель
# под формой — иначе светлый текст палитры на нём не читается.
# «Как сейчас» (15.09.2026) собирается из этого же шаблона: фон — размытый
# снимок экрана с прежними настройками, аватар по центру экрана, шрифт
# JetBrainsMono. Прежний hyprlock.conf остался страховкой в scripts/lockscreen.
#
# Два монитора (16.09.2026, просьба: «ввод логина и пароля в двух мониторах —
# нелепо»): форма (метка MON_FORM) — только на MSI справа, если он подключён;
# на остальных мониторах витрина (метка COMPANION) — часы, дата и подсказка,
# где вводить пароль. Монитор один — MON_FORM пустая, всё как раньше.

source = ~/.cache/hyprlock-greeting.conf

background {
    monitor =
    path = @@BG@@
    color = rgb(@@SURFACE@@)
    blur_passes = @@BLUR_PASSES@@
    blur_size = @@BLUR_SIZE@@
    noise = @@NOISE@@
    brightness = @@BRIGHT@@
    contrast = @@CONTRAST@@
    vibrancy = @@VIBRANCY@@
    vibrancy_darkness = @@VIBRANCY_DARKNESS@@
}

@@PANEL@@

@@AVATAR@@

# ВРЕМЯ
label {
    monitor = @@MON_FORM@@
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(@@PRIMARY@@)
    font_size = 104
    font_family = @@FONT@@
    position = @@X_CLOCK@@, 230
    halign = @@HALIGN@@
    valign = center
    shadow_passes = 1
    shadow_size = 3
}

# ДАТА
label {
    monitor = @@MON_FORM@@
    text = cmd[update:60000] @@DATE_CMD@@
    color = rgb(@@ON_SURFACE@@)
    font_size = 22
    font_family = @@FONT@@
    position = @@X_DATE@@, 140
    halign = @@HALIGN@@
    valign = center
    shadow_passes = 1
}

# ПОЛЕ ПОЛЬЗОВАТЕЛЯ: пилюля, иконка, имя
shape {
    monitor = @@MON_FORM@@
    size = 320, 40
    color = rgba(@@FIELD@@)
    rounding = 20
    border_size = 0
    position = @@X_FIELD@@, @@Y_USER@@
    halign = @@HALIGN@@
    valign = center
}
image {
    monitor = @@MON_FORM@@
    path = @@ICON_USER@@
    size = 16
    rounding = 0
    border_size = 0
    position = @@X_ICON@@, @@Y_USER@@
    halign = @@HALIGN@@
    valign = center
}
label {
    monitor = @@MON_FORM@@
    text = $USER
    color = rgb(@@ON_SURFACE@@)
    font_size = 14
    font_family = @@FONT@@
    position = @@X_TEXT@@, @@Y_USER@@
    halign = @@HALIGN@@
    valign = center
}

# ПОЛЕ ПАРОЛЯ: приветствие вместо подсказки, Caps Lock и ошибка — цветом
input-field {
    monitor = @@MON_FORM@@
    size = 320, 40
    outline_thickness = 2
    rounding = 20
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(@@PRIMARY@@99)
    inner_color = rgba(@@FIELD@@)
    font_color = rgb(@@ON_SURFACE@@)
    check_color = rgb(@@SECONDARY@@)
    fail_color = rgb(@@ERROR@@)
    capslock_color = rgb(@@TERTIARY@@)
    fail_text = <i>Неверный пароль ($ATTEMPTS)</i>
    fade_on_empty = false
    font_family = @@FONT@@
    placeholder_text = <span foreground="##@@ON_SURFACE_VARIANT@@">$GREETING</span>
    hide_input = false
    position = @@X_FIELD@@, @@Y_PASS@@
    halign = @@HALIGN@@
    valign = center
}
image {
    monitor = @@MON_FORM@@
    path = @@ICON_PASSWORD@@
    size = 16
    rounding = 0
    border_size = 0
    position = @@X_ICON@@, @@Y_PASS@@
    halign = @@HALIGN@@
    valign = center
}

# РАСКЛАДКА под формой — как в hyprlock.conf
label {
    monitor = @@MON_FORM@@
    text = cmd[update:500] $HOME/.config/hypr/scripts/lock_layout.sh
    color = rgb(@@SECONDARY@@)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Bold
    position = @@X_LAYOUT@@, @@Y_LAYOUT@@
    halign = @@HALIGN@@
    valign = center
}

# УГЛЫ — заряд справа сверху, сеть слева сверху, как в hyprlock.conf
label {
    monitor = @@MON_FORM@@
    text = cmd[update:30000] $HOME/.config/hypr/scripts/lock_battery.sh
    color = rgb(@@SECONDARY@@)
    font_size = 14
    font_family = JetBrainsMono Nerd Font Propo
    position = -36, -28
    halign = right
    valign = top
}
label {
    monitor = @@MON_FORM@@
    text = cmd[update:30000] $HOME/.config/hypr/scripts/lock_net.sh
    color = rgb(@@SECONDARY@@)
    font_size = 11
    font_family = JetBrainsMono Nerd Font Bold
    position = 36, -28
    halign = left
    valign = top
}

# КНОПКИ ПИТАНИЯ (30.09.2026) — снизу по центру. Выход, перезагрузка и
# выключение — двойным щелчком: первый взводит (значок краснеет, подсказка
# ниже), второй в течение 5 с выполняет. Сон — сразу. scripts/lock_power.py.
# Шрифт Propo: у обычного JetBrainsMono Nerd Font значок шире клетки, и hyprlock
# обрезал его край. Наведения hyprlock 0.9.6 не умеет вовсе (у надписей есть
# только onclick) — поэтому у каждой кнопки постоянный кружок-рамка.
# Всё выровнено по центру (valign center): у кружка и значка одна середина.
shape {
    monitor = @@MON_FORM@@
    size = 60, 60
    rounding = -1
    color = rgba(00000033)
    border_size = 2
    border_color = rgba(@@SECONDARY@@88)
    position = -120, -440
    halign = center
    valign = center
}
label {
    monitor = @@MON_FORM@@
    text = cmd[update:250] $HOME/.config/hypr/scripts/lock_power_label.sh label logout
    onclick = python3 $HOME/.config/hypr/scripts/lock_power.py click logout
    color = rgb(@@SECONDARY@@)
    font_size = 22
    font_family = JetBrainsMono Nerd Font Propo
    position = -120, -440
    halign = center
    valign = center
}
shape {
    monitor = @@MON_FORM@@
    size = 60, 60
    rounding = -1
    color = rgba(00000033)
    border_size = 2
    border_color = rgba(@@SECONDARY@@88)
    position = -40, -440
    halign = center
    valign = center
}
label {
    monitor = @@MON_FORM@@
    text = cmd[update:250] $HOME/.config/hypr/scripts/lock_power_label.sh label suspend
    onclick = python3 $HOME/.config/hypr/scripts/lock_power.py click suspend
    color = rgb(@@SECONDARY@@)
    font_size = 22
    font_family = JetBrainsMono Nerd Font Propo
    position = -40, -440
    halign = center
    valign = center
}
shape {
    monitor = @@MON_FORM@@
    size = 60, 60
    rounding = -1
    color = rgba(00000033)
    border_size = 2
    border_color = rgba(@@SECONDARY@@88)
    position = 40, -440
    halign = center
    valign = center
}
label {
    monitor = @@MON_FORM@@
    text = cmd[update:250] $HOME/.config/hypr/scripts/lock_power_label.sh label reboot
    onclick = python3 $HOME/.config/hypr/scripts/lock_power.py click reboot
    color = rgb(@@SECONDARY@@)
    font_size = 22
    font_family = JetBrainsMono Nerd Font Propo
    position = 40, -440
    halign = center
    valign = center
}
shape {
    monitor = @@MON_FORM@@
    size = 60, 60
    rounding = -1
    color = rgba(00000033)
    border_size = 2
    border_color = rgba(@@SECONDARY@@88)
    position = 120, -440
    halign = center
    valign = center
}
label {
    monitor = @@MON_FORM@@
    text = cmd[update:250] $HOME/.config/hypr/scripts/lock_power_label.sh label shutdown
    onclick = python3 $HOME/.config/hypr/scripts/lock_power.py click shutdown
    color = rgb(@@SECONDARY@@)
    font_size = 22
    font_family = JetBrainsMono Nerd Font Propo
    position = 120, -440
    halign = center
    valign = center
}
label {
    monitor = @@MON_FORM@@
    text = cmd[update:250] $HOME/.config/hypr/scripts/lock_power_label.sh hint
    color = rgb(@@SECONDARY@@)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, -490
    halign = center
    valign = center
}

@@COMPANION@@
