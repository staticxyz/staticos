general {
    # Команда блокировки экрана
    lock_cmd = $HOME/.config/hypr/scripts/lockscreen
    
    # Блокировка перед уходом в сон
    before_sleep_cmd = loginctl lock-session

    # Подсветка Razer после сна. Устройство обесточивается и просыпается
    # погашенным, а Polychromatic сам её не возвращает: он применяет профиль
    # при своём запуске, а не при пробуждении машины.
    #
    # Вторым идёт audio_repair. После сна WirePlumber иногда оставляет узлы,
    # чей Device уже уничтожен; умолчания указывают на такой узел, и звук
    # уходит в никуда при полностью здоровом виде в wpctl (замерено 02.09:
    # шесть сирот, /proc/asound/.../status = closed). Скрипт перезапускает
    # WirePlumber ТОЛЬКО если сироты действительно есть, на здоровом графе
    # выходит за две секунды и ничего не трогает. DPMS он не касается.
    after_sleep_cmd = sh -c '$HOME/.config/hypr/scripts/razer_restore; $HOME/.config/hypr/scripts/audio_repair'
    
    # after_sleep_cmd намеренно убран: он гонялся с key_press_enables_dpms/
    # mouse_move_enables_dpms (misc.lua) за право включить экран первым —
    # два вызова dpms почти одновременно = мёртвый чёрный экран (см. коммент
    # в scripts/dpms). После сна пользователь и так сразу трогает мышь/клаву,
    # так что key/mouse_enables_dpms сами разбудят монитор без явного хука.

    # Игнорировать запреты от плееров и браузеров (чтобы сон работал даже при фоновой музыке)
    ignore_dbus_inhibit = true
}

# 00. Заставка staticOS (03.10.2026) — scripts/screensaver.py.
#     Через минуту простоя `arm` начинает ждать остаток задержки (screensaver.py
#     idle, по умолчанию 3 мин — на две раньше блокировки) и показывает заставку;
#     любой ввод (on-resume) ожидание снимает. Задержка меняется без перезапуска
#     hypridle. ignore_inhibit = true: иначе Savage Mode (systemd-инхибитор idle)
#     не пускал бы её никогда; видео, игру, запись, «не отключать экран» и
#     заблокированный сеанс скрипт проверяет сам (screensaver.py why).
listener {
    timeout = 60
    ignore_inhibit = true
    on-timeout = python3 $HOME/.config/hypr/scripts/screensaver.py arm
    on-resume  = python3 $HOME/.config/hypr/scripts/screensaver.py disarm
}

# 0. Приглушение за полминуты до блокировки — чтобы она не заставала
#    врасплох: экран темнеет, и хватает шевельнуть мышью, чтобы продолжить.
#    Гамма через hyprsunset, а не подсветка: brightnessctl умеет только
#    экран ноутбука, а hyprsunset приглушает ВСЕ мониторы одинаково.
#    Ночной режим (температура) при этом не сбивается — это другая ручка.
#    ignore_inhibit: приглушать даже когда кто-то держит инхибитор простоя —
#    в том числе Savage Mode. Гасить экран он мешать не должен, его дело — сон.
listener {
    timeout = 270
    ignore_inhibit = true
    on-timeout = $HOME/.config/hypr/scripts/idle_dim dim
    on-resume  = $HOME/.config/hypr/scripts/idle_dim restore
}

# 1. Блокировка экрана через 5 минут.
#
# ignore_inhibit = true: блокировка срабатывает ВСЕГДА, даже при включённом
# Savage Mode. Раньше savage держал systemd-инхибитор --what=idle, hypridle его
# уважал и замирал целиком — не было ни приглушения, ни блокировки, ни сна.
# Теперь savage отменяет только сон (см. listener ниже и scripts/idle_suspend).
listener {
    timeout = 300
    ignore_inhibit = true
    on-timeout = $HOME/.config/hypr/scripts/idle_lock
}

# 2. Гашение экранов по простою УБРАНО НАСОВСЕМ (2026-09-01).
#
# Чёрный экран после сна повторился трижды. Общее у всех случаев: к моменту
# засыпания экран УЖЕ был погашен программно, и на пробуждении его надо было
# включать командой — именно там всё и ломалось.
#
# Звено оказалось лишним: при уходе в сон экран гаснет сам, аппаратно, без
# всякой команды. Значит гасить его заранее незачем, а восстанавливать после
# сна больше не нужно — Hyprland делает это сам.
#
# Цена: экран горит между блокировкой и засыпанием — теперь это пять минут,
# из них последние пять он уже почти чёрный (ступень ниже).
# Это несравнимо меньше, чем перезагрузка вслепую.
#
# Если когда-нибудь захочется вернуть, блок выглядел так:
#     listener {
#         timeout = 300
#         on-timeout = ~/.config/hypr/scripts/dpms off
#         on-resume  = ~/.config/hypr/scripts/dpms on
#     }
# Обе строки нужны парой: первая гасит, вторая возвращает. Но прежде чем
# возвращать — выясни, почему экран не оживал после сна.

# 2а. Глубокое приглушение через 10 минут — ВМЕСТО выключения экрана.
#
# Экран гасить нечем: DPMS убран навсегда (см. блок выше — после него экран
# однажды не проснулся). Здесь вместо этого картинка уводится почти в чёрное
# (гамма 6%) и подсветка обоих экранов опускается до 5%. Выход из этого —
# любое движение мыши, никаких команд включения не требуется, поэтому прежняя
# поломка повториться не может.
#
# Смысл порога: блокировка уже случилась на 5 минутах, а сон наступит на
# 15 — и то лишь когда выключен Savage Mode. При включённом Savage Mode сна
# нет вовсе, и без этой ступени экран горел бы всю ночь (21.09.2026).
listener {
    timeout = 600
    ignore_inhibit = true
    on-timeout = $HOME/.config/hypr/scripts/idle_dim deep
    on-resume  = $HOME/.config/hypr/scripts/idle_dim restore
}

# 3. Полный уход в спящий режим через 15 минут.
#
# Без ignore_inhibit — значит любой честный инхибитор простоя (в том числе
# Savage Mode) сон отменяет. Скрипт проверяет Savage Mode ещё и сам, явно:
# так правило «savage = блокировка есть, сна нет» записано словами, а не
# выводится из чужой семантики. Прежний вариант звал pgrep -f "sleep infinity",
# что цепляло любой посторонний sleep.
listener {
    timeout = 900
    on-timeout = $HOME/.config/hypr/scripts/idle_suspend
}
