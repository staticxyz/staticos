# Palette generated by matugen from the current wallpaper
source = ~/.cache/matugen/hyprlock-colors.conf

# Приветствие по времени суток. Пишется скриптом scripts/lockscreen прямо
# перед запуском блокировки — placeholder_text не умеет выполнять команды,
# в отличие от label, поэтому значение приходит готовой переменной.
source = ~/.cache/hyprlock-greeting.conf

# BACKGROUND (Автоматически берет текущий вид рабочего стола)
background {
    monitor =
    path = screenshot
    color = $m_bg

    # Сильный блюр + затемнение для эффекта глубокого синего стекла
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.3500
    vibrancy = 0.2100
    vibrancy_darkness = 0.3
}

# АВАТАР
# Файл кладёт scripts/avatar_picker.py — он обрезает выбранную картинку по
# центру в квадрат. rounding = -1 просит идеальный круг, иначе пришлось бы
# подбирать радиус под размер вручную.
image {
    monitor =
    path = ~/.cache/avatar.png
    size = 130
    rounding = -1
    border_size = 3
    border_color = $m_primary
    position = 0, 0
    halign = center
    valign = center
}

# ВРЕМЯ
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $m_primary
    font_size = 110
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 190
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# ДАТА
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = $m_secondary
    font_size = 22
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 1
}

# ПОЛЕ ПАРОЛЯ
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = $m_primary
    inner_color = $m_surface
    font_color = $m_fg
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##$m_primary_hex">$GREETING</span></i>
    hide_input = false

    # Рамка меняет цвет при включённом Caps Lock. Без этого верный пароль
    # молча не подходит, и причина никак не видна.
    capslock_color = $m_tertiary

    # Отклик на неверный пароль. $ATTEMPTS подставляет число попыток.
    fail_color = $m_error
    fail_text = <i>Неверный пароль ($ATTEMPTS)</i>
    check_color = $m_secondary

    position = 0, -110
    halign = center
    valign = center
    shadow_passes = 1
}

# РАСКЛАДКА
# Под полем пароля: неверная раскладка — вторая после Caps Lock причина, по
# которой верный пароль «не подходит», а увидеть её на замке было негде.
# Оформление намеренно повторяет модуль языка в waybar (󰌌 US / 󰌌 RU), чтобы
# метка читалась как продолжение панели, а не как чужой элемент.
# Берётся основная клавиатура: hyprctl перечисляет и вторые устройства,
# у которых active_keymap свой и меняться вместе с общей раскладкой не обязан.
label {
    monitor =
    text = cmd[update:500] $HOME/.config/hypr/scripts/lock_layout.sh
    color = $m_secondary
    font_size = 16
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -175
    halign = center
    valign = center
    shadow_passes = 1
}

# УГЛЫ. Мелкие метки по краям, а не в общий центр: центр занят временем,
# аватаром и паролем, и новое там только спорило бы с ними за внимание.
# Цвет — вторичный из палитры, как у даты и раскладки.

# Справа сверху — заряд. Берётся тот же текст, что у модуля батареи в баре
# (scripts/savage_battery.py): в режиме Savage это один значок без процентов —
# ноутбук тогда 24/7 на зарядке, и процент смысла не имеет.
label {
    monitor =
    text = cmd[update:30000] python3 $HOME/.config/hypr/scripts/savage_battery.py | python3 -c 'import json,sys; print(json.load(sys.stdin)["text"])'
    color = $m_secondary
    font_size = 14
    font_family = JetBrainsMono Nerd Font Bold
    position = -36, -28
    halign = right
    valign = top
    shadow_passes = 1
}

# Слева сверху — сеть: проводная или имя Wi-Fi (scripts/lock_net.sh).
label {
    monitor =
    text = cmd[update:30000] $HOME/.config/hypr/scripts/lock_net.sh
    color = $m_secondary
    font_size = 14
    font_family = JetBrainsMono Nerd Font Bold
    position = 36, -28
    halign = left
    valign = top
    shadow_passes = 1
}
