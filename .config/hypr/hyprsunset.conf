# Ночной режим по расписанию — hyprsunset.
#
# Раньше ночной режим включался из панели «Энергия» через wlsunset, и работал
# он криво. hyprsunset — родная для Hyprland утилита: цвет меняет сам
# компоновщик (матрица цвета), а не подмена гаммы со стороны.
#
# Расписание: с 22:00 тёплый свет, с 5:00 обычный. 4100K — то же, что
# давал ползунок панели «Энергия» на своих 65% (6500 - 0.65 x 3700).
# Панель по-прежнему включает и выключает режим вручную — через этот же
# hyprsunset (hyprctl hyprsunset ...), а не отдельной программой, чтобы
# два управляющих цветом не спорили друг с другом.

profile {
    time = 5:00
    identity = true
}

profile {
    time = 22:00
    temperature = 4100
}
