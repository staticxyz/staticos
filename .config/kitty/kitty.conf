# Самоперечитывание конфига ВЫКЛЮЧЕНО (23.09.2026). По умолчанию kitty следит за
# kitty.conf и через 0.1 с после любой правки перечитывает его во ВСЕХ окнах,
# а перечитывание ставит каждому окну font_size из конфига: окна приборной
# панели с уменьшенным шрифтом сжались, и нарисованное один раз (fastfetch)
# обрезалось навсегда (поймано на правке ниже про Ctrl+буквы). Перечитывать
# конфиг — только kitten reload_keep_font.py (theme_changer.sh), он размер
# не трогает. Для уже запущенных kitty это значение не действует.
auto_reload_config -1

#font
# Шрифт выбирается в Настройках → Шрифты (app_fonts.py меняет эту строку и
# перечитывает конфиг в открытых окнах). До 17.09.2026 здесь стоял Hasklug Nerd
# Font, которого в системе нет, — на деле терминал рисовал Noto Sans Mono.
font_family	PxPlus HP 100LX 6x8
font_size	12.0

#transparent
# Итоговая прозрачность перемножается с hyprland active/inactive_opacity
# (0.78/0.62 в visuals.lua): 0.62 здесь даёт ~0.48 у активного окна и ~0.38 у
# неактивного — обои видно сквозь терминал, но текст остаётся читаемым.
background_opacity 0.62

#window settings
window_padding_width 8
hide_window_decorations no
# Было 22 — содержимое отодвигалось от краёв, и в зазоре просвечивал фон
# окна, из-за чего внутри терминала виднелась вторая рамка поверх рамки
# Hyprland. Отступ от текста до края даёт window_padding_width выше.
window_margin_width 0
confirm_os_window_close 0

#pointer
cursor_shape beam
cursor_blink_interval 0.5
cursor_trail 1
# Порог движения, с которого появляется след. По умолчанию 2 2: след возникает,
# только когда курсор ПРЫГАЕТ больше чем на две ячейки. При обычном наборе он
# смещается на одну, порог не проходится — и ни разряда, ни отдачи не видно
# (искал причину 28.09.2026). 0 0 — след на каждый символ, ради тренажёра набора.
cursor_trail_start_threshold 0 0

#tabs
tab_bar_style powerline

shell /usr/bin/fish
