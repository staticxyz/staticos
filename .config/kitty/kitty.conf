include ~/.cache/matugen/colors-kitty.conf

# transparent_background_colors отдельным файлом: этот ключ роняет
# `kitty @ set-colors --configured`, которым theme_changer.sh заливает
# палитру в живые окна. Подхватывается перечитыванием конфига: скрипт шлёт по
# сокету kitten reload_keep_font.py (он сохраняет размер шрифта окон; SIGUSR1 —
# только kitty без сокета), 15.09.2026.
include ~/.cache/matugen/kitty-opacity.conf
allow_remote_control yes

# Socket for live theming (matugen): one socket per kitty instance
listen_on unix:/tmp/kitty-{kitty_pid}

# Shift+Enter — абзац вместо отправки.
# Терминал не отличает Enter от Shift+Enter, поэтому шлём Esc+Enter: это
# штатное «вставить перевод строки» в TUI- и readline-приложениях.
# Ctrl+V тут не трогаем — в TUI-программах он занят вставкой из буфера.
map shift+enter send_text all \x1b\r

#font-size-reset
# Ctrl+Shift+0 — вернуть размер шрифта из этой строки font_size (23.09.2026).
#
# Масштаб — ТОЛЬКО ТЕКУЩЕГО окна (current), с 29.09.2026. Встроенные сочетания
# kitty меняют его с охватом all — во всех окнах процесса, и новые окна
# наследуют изменённый размер. Пока у каждого терминала был свой процесс, all
# значило «это окно». Но теперь Ctrl+` открывает окна ОДНОЙ общей копии kitty,
# и увеличение в одном окне перешло бы на все новые — пользователю это не нужно.
# Проверено: при all новое окно открылось 16 pt, при current — обычными 12.
map ctrl+shift+equal       change_font_size current +2.0
map ctrl+shift+plus        change_font_size current +2.0
map ctrl+shift+kp_add      change_font_size current +2.0
map ctrl+shift+minus       change_font_size current -2.0
map ctrl+shift+kp_subtract change_font_size current -2.0
map ctrl+shift+backspace   change_font_size current 0
map ctrl+shift+0           change_font_size current 0
# include themes/noctalia.conf   — отключено 21.09.2026: Noctalia перекрывала палитру matugen и при каждом применении темы перезагружала конфиг kitty, сбрасывая размер шрифта (а с ним и размеры окон).

# Ctrl+буква на русской раскладке — как на английской, для любой программы в
# терминале (23.09.2026). Программы с протоколом клавиатуры kitty (Neovim) при
# русской раскладке получают Ctrl+г, а не Ctrl+u, и сочетание пропадает —
# «Ctrl+U/D не работают на русской». Здесь та же физическая клавиша
# отправляется как латинская. Буквы без модификатора не трогаются: в Neovim
# их переводит langmap (lua/config/options.lua), в остальном они и должны быть
# русскими. Действует в терминалах, открытых после правки.
map ctrl+й send_key ctrl+q
map ctrl+ц send_key ctrl+w
map ctrl+у send_key ctrl+e
map ctrl+к send_key ctrl+r
map ctrl+е send_key ctrl+t
map ctrl+н send_key ctrl+y
map ctrl+г send_key ctrl+u
map ctrl+ш send_key ctrl+i
map ctrl+щ send_key ctrl+o
map ctrl+з send_key ctrl+p
map ctrl+ф send_key ctrl+a
map ctrl+ы send_key ctrl+s
map ctrl+в send_key ctrl+d
map ctrl+а send_key ctrl+f
map ctrl+п send_key ctrl+g
map ctrl+р send_key ctrl+h
map ctrl+о send_key ctrl+j
map ctrl+л send_key ctrl+k
map ctrl+д send_key ctrl+l
map ctrl+я send_key ctrl+z
map ctrl+ч send_key ctrl+x
map ctrl+с send_key ctrl+c
map ctrl+м send_key ctrl+v
map ctrl+и send_key ctrl+b
map ctrl+т send_key ctrl+n
map ctrl+ь send_key ctrl+m

# Свой шейдер (kitty 0.49+). Переключается в «Настройках» → «Вид»,
# либо ~/.config/hypr/scripts/kitty_shader.py. Нужен пакет shader-slang.

# Звонок терминала служит сигналом для шейдера молний: jtype подаёт его, когда
# набор ускоряется, а шейдер speedburst ловит событие bell-in-window. Поэтому
# звук и мигание окна выключены — иначе каждая молния пищала бы и дёргала бар.
enable_audio_bell no
window_alert_on_bell no

# Шейдеры (kitty 0.49+). Переключаются в «Настройках» → «Шейдеры»,
# либо ~/.config/hypr/scripts/kitty_shader.py. Нужен пакет shader-slang.

# Шейдеры (kitty 0.49+). Переключаются в «Настройках» → «Шейдеры»,
# либо ~/.config/hypr/scripts/kitty_shader.py. Нужен пакет shader-slang.

# Шейдеры (kitty 0.49+). Переключаются в «Настройках» → «Шейдеры»,
# либо ~/.config/hypr/scripts/kitty_shader.py. Нужен пакет shader-slang.

# Шейдеры (kitty 0.49+). Переключаются в «Настройках» → «Шейдеры»,
# либо ~/.config/hypr/scripts/kitty_shader.py. Нужен пакет shader-slang.

# Шейдеры (kitty 0.49+). Переключаются в «Настройках» → «Шейдеры»,
# либо ~/.config/hypr/scripts/kitty_shader.py. Нужен пакет shader-slang.

# Шейдеры (kitty 0.49+). Переключаются в «Настройках» → «Шейдеры»,
# либо ~/.config/hypr/scripts/kitty_shader.py. Нужен пакет shader-slang.
custom_shaders trail-lightning crt90 typestorm
